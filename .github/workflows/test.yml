name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python3 -m unittest discover -s tests -p '*_test.py' -v
      - run: python3 scripts/draw-art.py && python3 scripts/draw-characters.py && python3 scripts/draw-farm-details.py && git diff --exit-code -- mods/tinydust layouts/tinydust.svg
